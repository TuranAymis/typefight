name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping staging deploy."
          fi
      - name: Check out repository
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: Deploy API Worker (staging)
        if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy:staging -w @typefight/api
      - name: Build web
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build -w @typefight/web
      - name: Deploy web to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler pages deploy apps/web/dist --project-name typefight-staging --branch main
      - name: Smoke test staging
        if: steps.secrets.outputs.ok == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors https://typefight-api-staging.galamor.workers.dev/health
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors https://typefight-staging.pages.dev/
